<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Diysno · Пульт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
:root {
  --bg: #1c1614; --surface: #251e1b; --surface-2: #312924; --line: #43372f;
  --fg: #f4ede2; --fg-2: #d8cfc2; --muted: #a99c8c;
  --accent: #ddb53d; --on-accent: #1c1614;
  --ok: #9fd39a; --warn: #ffb39a; --bad: #ff8f85;
  --f-display: "Unbounded", "Arial Black", "Segoe UI", sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4ede2; --surface: #fffaf1; --surface-2: #ebe2d3; --line: #cdbfa9;
  --fg: #1c1614; --fg-2: #3d332d; --muted: #6f6253;
  --accent: #b88a12; --on-accent: #fffaf1;
  --ok: #2f7a3a; --warn: #a8501f; --bad: #b3261e; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f4ede2; --surface: #fffaf1; --surface-2: #ebe2d3; --line: #cdbfa9;
  --fg: #1c1614; --fg-2: #3d332d; --muted: #6f6253;
  --accent: #b88a12; --on-accent: #fffaf1;
  --ok: #2f7a3a; --warn: #a8501f; --bad: #b3261e; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 96px; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { font: 800 15px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
h2 { font: 800 20px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font: 700 13px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 13.5px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.list { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; border: 0; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
.name { font-weight: 600; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font: 800 20px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat.hi b { color: var(--accent); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: currentColor; } .pill.warn { color: var(--warn); border-color: currentColor; } .pill.bad { color: var(--bad); border-color: currentColor; } .pill.acc { color: var(--accent); border-color: currentColor; }
.btn { border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 12px 16px; min-height: 46px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.btn.wide { width: 100%; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid currentColor; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.full i { background: var(--bad); }
.step { display: inline-flex; align-items: center; gap: 6px; }
.step button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; font-weight: 700; }
.step output { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.big .step button { width: 60px; height: 60px; font-size: 28px; border-radius: 14px; }
.big .step output { min-width: 56px; font: 800 26px/1 var(--f-display); }
.big .name { font-size: 18px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12.5px; color: var(--muted); }
.field input, .field select, .field textarea, .search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 600; color: var(--fg-2); }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 5;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 720px; margin: 0 auto; display: flex; gap: 4px; }
.tabs button { flex: 1 1 auto; border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--muted); min-width: 0; }
.tabs button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: var(--bg); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 720px; max-height: 88%; overflow: auto; display: grid; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: 90%; }
.pour { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.pour b { font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 12px; align-items: flex-start; }
.check input { width: 28px; height: 28px; accent-color: var(--accent); flex: none; margin: 2px 0 0; }
/* Аркуші для друку показані світлими в обох темах: це папір. */
.paper { background: #fff; color: #111; border-radius: 6px; padding: 14px; display: grid; gap: 8px; font-size: 13px; border: 1px solid #999; }
.paper h4 { margin: 0; font: 800 14px/1.2 var(--f-display); color: #111; }
.paper table { width: 100%; border-collapse: collapse; }
.paper td, .paper th { border: 1px solid #999; padding: 4px 6px; text-align: left; }
.paper .test { color: #b3261e; font-weight: 700; letter-spacing: .08em; }
.paper .code { height: 44px; background: repeating-linear-gradient(90deg, #111 0 2px, #fff 2px 4px, #111 4px 7px, #fff 7px 9px, #111 9px 10px, #fff 10px 13px); }
.paper .ttn { font: 700 18px/1 monospace; letter-spacing: .08em; }
.scroll-x { overflow-x: auto; }
@media (prefers-reduced-motion: no-preference) { .sheet > div { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
.role { margin-left: auto; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 3px 12px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.linkish { border: 0; background: none; padding: 4px 0; color: var(--muted); text-decoration: underline; text-align: left; font-size: 13.5px; justify-self: start; }
.btn:disabled, .step button:disabled { opacity: .45; cursor: default; }
.field textarea { resize: vertical; }
.login { max-width: 360px; margin: 0 auto; min-height: 100%; display: grid; align-content: center; gap: 14px; padding: 24px 16px; }
.login input { font: 800 28px/1 var(--f-display); letter-spacing: .3em; text-align: center; }
.err { color: var(--bad); font-weight: 600; min-height: 1.5em; }
.busybar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; overflow: hidden; display: none; }
.busybar i { display: block; height: 100%; width: 40%; background: var(--accent); }
body.busy .busybar { display: block; }
body.busy .btn, body.busy .item, body.busy .step button, body.busy .tabs button { pointer-events: none; opacity: .7; }
@media (prefers-reduced-motion: no-preference) { .busybar i { animation: run 1s linear infinite; } @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } } }
#print { display: none; }
@media print {
  html, body { background: #fff; height: auto; }
  body > *:not(#print) { display: none !important; }
  #print { display: grid; gap: 8mm; color: #111; }
  .paper { border: 0; border-radius: 0; padding: 0; font-size: 12pt; break-inside: avoid; }
  .paper.pb { break-before: page; }
  .paper .code { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  @page { margin: 12mm; }
}
</style>
</head>
<body>
<div class="busybar" aria-hidden="true"><i></i></div>
<section class="login" id="login" hidden>
  <p class="brand">Diysno</p>
  <h2>Вхід</h2>
  <p class="sub" id="login-text"></p>
  <form class="stack" id="login-form">
    <div class="field"><label for="pin">PIN</label><input id="pin" inputmode="numeric" autocomplete="off" maxlength="8"></div>
    <button class="btn wide" type="submit">Увійти</button>
  </form>
  <p class="err" id="login-err" role="alert"></p>
</section>
<div class="app" id="app" hidden>
  <header class="top">
    <p class="brand">Diysno</p>
    <span class="role" id="role"></span>
  </header>
  <main id="view" class="stack"></main>
</div>
<nav class="tabs" id="tabsnav" aria-label="Розділи" hidden><div id="tabs"></div></nav>
<div id="sheet" class="sheet" hidden><div id="sheet-body"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="print"></div>
<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbxzPllKUYE0g9ia2qawOyP0WAdOInNYIl3Q_3kV2IJf__Fz6RsbnOQO8lobSfoaz__k/exec";
  var LS = "diysno-pult-v1";
  var nf = new Intl.NumberFormat("uk-UA");
  var S = null, busy = false;
  var auth = { k: "", pin: "" };
  var ui = { tab: "", ofilter: "cur", q: "", draft: null, edit: null, stock: {}, packed: {}, confirm: "" };

  function $(id) { return document.getElementById(id); }
  function money(n) { return nf.format(Math.round(n)) + " грн"; }
  function pl(n, a, b, c) { var m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); }
  function kegs(n) { return n + " " + pl(n, "кег", "кеги", "кегів"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { if (!t) return; var el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2600); }
  // Входи запам'ятовуються окремо для Пульта і для Броварні; ?r=pult або ?r=brovarnia вибирає, який відкрити.
  var roles = {}, last = "", legacy = null, want = "";
  function store() { try { localStorage.setItem(LS, JSON.stringify({ roles: roles, last: last, packed: ui.packed })); } catch (e) {} }
  function use(c) { if (c && c.k) auth = { k: c.k, pin: c.pin || "" }; }
  function param(role) { return role === "tseh" ? "brovarnia" : "pult"; }
  function roleName(role) { return role === "tseh" ? "Броварня" : "Пульт"; }

  try {
    var saved = JSON.parse(localStorage.getItem(LS) || "{}");
    if (saved.roles && typeof saved.roles === "object") roles = saved.roles;
    last = saved.last || ""; ui.packed = saved.packed || {};
    if (saved.k) legacy = { k: saved.k, pin: saved.pin || "" };
  } catch (e) {}
  try {
    var qs = new URLSearchParams(location.search), qk = qs.get("k"), qr = qs.get("r");
    want = qr === "brovarnia" ? "tseh" : qr === "pult" ? "pult" : "";
    if (qk) {
      auth = { k: qk, pin: "" }; want = "";
      [roles.pult, roles.tseh, legacy].forEach(function (c) { if (c && c.k === qk) auth.pin = c.pin || ""; });
      history.replaceState(null, "", location.pathname);
    } else if (want) use(roles[want] || legacy);
    else use(roles[last] || roles.pult || roles.tseh || legacy);
  } catch (e) {}

  function beer(id) { return S.beers.filter(function (b) { return b.id === id; })[0]; }
  function free(b) { return b.stock == null ? null : Math.max(0, b.stock - b.reserved); }
  function freeText(b) { var f = free(b); return f == null ? "без обліку" : "вільно " + f; }
  function itemsText(items) { return Object.keys(items).filter(function (id) { return items[id] > 0; }).map(function (id) { var b = beer(id); return esc(b ? b.name : id) + " × " + items[id]; }).join(", "); }
  function sumItems(items) { var t = { kegs: 0, liters: 0, bottles: 0, money: 0 }; Object.keys(items).forEach(function (id) { var b = beer(id), q = items[id]; if (!b || !(q > 0)) return; if (b.unit === "keg") { t.kegs += q; t.liters += q * S.kegL; t.money += q * S.kegL * b.price; } else { t.bottles += q; t.money += q * b.price; } }); return t; }
  function statusPill(s) { var c = s === "нове" ? "acc" : s === "у відправці" || s === "створено" ? "warn" : s === "відправлено" || s === "отримано" ? "ok" : "bad"; return '<span class="pill ' + c + '">' + esc(s) + "</span>"; }
  function batches(filter) { var m = {}, out = []; S.shipments.forEach(function (s) { if (filter && !filter(s)) return; if (!m[s.batch]) { m[s.batch] = { id: s.batch, created: s.created, status: s.status, sent: s.sent, list: [] }; out.push(m[s.batch]); } m[s.batch].list.push(s); }); return out.reverse(); }

  /* ---------- зв'язок ---------- */
  function call(op, extra, quiet) {
    if (busy) return Promise.resolve(null);
    busy = true; document.body.classList.add("busy");
    var body = { a: "adm", k: auth.k, pin: auth.pin, op: op };
    Object.keys(extra || {}).forEach(function (x) { body[x] = extra[x]; });
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        busy = false; document.body.classList.remove("busy");
        if (!j.ok && (j.code === "key" || j.code === "pin" || j.code === "lock")) {
          if (j.code !== "lock") { auth.pin = ""; ["pult", "tseh"].forEach(function (x) { if (roles[x] && roles[x].k === auth.k) { if (j.code === "key") delete roles[x]; else roles[x].pin = ""; } }); store(); }
          login(j.error, j.code); return null;
        }
        if (j.state) S = j.state;
        if (!j.ok) { toast(j.error || "Не вдалося виконати."); if (S) render(); return null; }
        roles[j.role] = { k: auth.k, pin: auth.pin }; legacy = null;
        if (want && want !== j.role) {
          var miss = want; want = ""; store(); S = null; auth = { k: "", pin: "" };
          login("На цьому пристрої ще не входили в розділ «" + roleName(miss) + "». Перший вхід — за його секретним посиланням і PIN-кодом.", "key"); return null;
        }
        want = ""; S = j; last = j.role; store();
        try { history.replaceState(null, "", location.pathname + "?r=" + param(j.role)); } catch (e) {}
        if (!ui.tab || TABS[S.role].map(function (t) { return t[0]; }).indexOf(ui.tab) < 0) ui.tab = TABS[S.role][0][0];
        $("login").hidden = true; $("app").hidden = false; $("tabsnav").hidden = false;
        if (!quiet) toast(j.msg);
        render();
        return j;
      })
      .catch(function () { busy = false; document.body.classList.remove("busy"); toast("Немає зв'язку. Перевірте інтернет і спробуйте ще раз."); return null; });
  }
  function login(err, code) {
    $("app").hidden = true; $("tabsnav").hidden = true; $("login").hidden = false;
    $("login-err").textContent = err || "";
    $("login-form").hidden = code === "key" || !auth.k;
    $("login-text").textContent = !auth.k || code === "key" ? "Перший вхід на новому пристрої — за секретним посиланням, яке дав менеджер." : "Введіть PIN. На цьому пристрої його більше не питатимуть.";
  }

  /* ---------- Пульт ---------- */
  function orderList(list) {
    if (!list.length) return '<p class="sub">Тут поки порожньо.</p>';
    return '<div class="list">' + list.slice().reverse().map(function (o) { return '<button class="item" data-act="order" data-v="' + o.n + '"><span class="row"><span class="name grow">№ ' + o.n + " · " + esc(o.venue) + (o.isNew ? ' <span class="pill acc">новий клієнт</span>' : "") + "</span>" + statusPill(o.status) + '</span><span class="sub">' + itemsText(o.items) + '</span><span class="row sub"><span class="grow">' + esc(o.date) + " · " + esc(o.city) + '</span><span class="num">' + money(o.sum) + "</span></span></button>"; }).join("") + "</div>";
  }
  function shipList(list) {
    return '<div class="list">' + list.map(function (s) { return '<div class="item"><div class="row"><span class="name grow">' + esc(s.venue) + "</span>" + statusPill(s.status) + '</div><span class="sub">' + esc(s.address || s.city) + " · місць: " + s.seats + ' · ТТН <span class="num">' + esc(s.ttn) + '</span></span><span class="sub">' + itemsText(s.items) + " · замовлення № " + esc(s.orders) + "</span></div>"; }).join("") + "</div>";
  }
  function vZbir() {
    var list = S.orders.filter(function (o) { return o.status === "нове"; }), t = { kegs: 0, liters: 0, money: 0 };
    list.forEach(function (o) { t.kegs += o.kegs; t.liters += o.liters; t.money += o.sum; });
    var h = '<div class="row"><div class="grow"><h2>' + esc(S.cycle.title) + "</h2>" + (S.cycle.ship ? '<p class="sub">Відправка: у ' + esc(S.cycle.ship) + "</p>" : '<p class="sub">Дні дедлайну й відправки задаються в налаштуваннях.</p>') + '</div><button class="btn ghost small" data-act="refresh">Оновити</button></div>';
    h += '<div class="stats"><div class="stat"><b>' + list.length + '</b><span>нових замовлень</span></div><div class="stat"><b>' + t.kegs + "</b><span>кегів · " + nf.format(t.liters) + ' л</span></div><div class="stat"><b>' + money(t.money) + '</b><span>сума збору</span></div></div>';
    batches(function (s) { return s.status === "створено"; }).forEach(function (b) {
      h += "<h3>Готується до відправки · партія " + esc(b.id) + "</h3>" + shipList(b.list) + '<div class="row"><button class="btn grow" data-act="print" data-v="' + esc(b.id) + '">Аркуші для друку</button>' +
        (ui.confirm === "sent" + b.id ? '<button class="btn danger" data-act="sent" data-v="' + esc(b.id) + '">Так, відправлено</button>' : '<button class="btn ghost" data-act="ask" data-v="sent' + esc(b.id) + '">Відправлено</button>') + "</div>";
    });
    h += "<h3>По сортах: замовлено із залишку</h3><div class=\"list\">" + S.beers.filter(function (b) { return b.status === "on"; }).map(function (b) {
      var f = free(b), w = b.stock ? Math.min(100, Math.round(b.reserved / b.stock * 100)) : 0;
